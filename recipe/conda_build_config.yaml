# TF 2.21.0 / XLA require clang for part of the build (xla/codegen/intrinsic
# cc_to_llvm_ir emits LLVM bitcode via -emit-llvm). Build the CPU variant with
# conda-forge clang on linux, matching TensorFlow upstream which builds with
# clang. clangxx_linux-64 still targets libstdc++ so the conda ABI is unchanged.
# The CUDA variants must stay on gcc (nvcc needs a gcc host compiler, and the
# cuda migrators pin c_compiler_version); leaving these unset there lets the
# global pinning + migrator choose gcc.
c_compiler:                     # [linux and cuda_compiler_version == "None"]
  - clang                       # [linux and cuda_compiler_version == "None"]
cxx_compiler:                   # [linux and cuda_compiler_version == "None"]
  - clangxx                     # [linux and cuda_compiler_version == "None"]
c_compiler_version:             # [linux and cuda_compiler_version == "None"]
  - 18                          # [linux and cuda_compiler_version == "None"]
cxx_compiler_version:           # [linux and cuda_compiler_version == "None"]
  - 18                          # [linux and cuda_compiler_version == "None"]

github_actions_labels:          # [unix]
- namespace-profile-16cpu-on-linux-64       # [linux64]
- namespace-profile-16cpu-on-linux-64       # [linux and aarch64]
- namespace-profile-12cpu-on-osx-arm64      # [osx]
microarch_level:
- 1
# hmaarrfk -- temporary, uncomment during actual build
- 3   # [linux and x86_64]
